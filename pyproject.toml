[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disentangled-flash"
version = "0.1.2"
description = "Fast exact DeBERTa-style disentangled attention in Triton"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Delyan Boychev", "email" = "delyan.boychev05@gmail.com"}]
dependencies = [
    "torch>=2.7",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.57",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "cuda: requires an NVIDIA CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"
include = [
    "validation/**/*.py",
    "tests/**/*.py",
    "src/**/*.py",
    "benchmarks/**/*.py",
    ".github/**/*.py",
    "examples/**/*.py",
]
exclude = [
    "src/disentangled_flash/_reference.py",
]

[tool.ruff.lint]
exclude = [
    ".github/**/*.py",
    "examples/**/*.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
